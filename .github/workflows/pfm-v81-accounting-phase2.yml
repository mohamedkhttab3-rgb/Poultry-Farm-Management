name: PFM V8.1 Phase 3 — PDF footer and broiler financial lifecycle
on:
  push:
    branches: ['feature/pfm-v81-pdf-finance-qa']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  accounting:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check app and accounting source
        run: |
          node --check www/pfm-v81-accounting-core.js
          node --check www/pfm-v81-accounting-ui.js
          node --check www/pfm-v8-invoice-core.js
          node --check www/pfm-v8-invoice-ui.js
          node --check www/pfm-v8-purchases-workspace.js
          node --check www/v410-finance.js
          node scripts/verify-source.cjs
          node scripts/verify-public.cjs
          node scripts/verify-native.cjs
      - name: Execute accounting, purchasing and production regressions
        run: |
          node tests/test_v81_shared_costs_depreciation.cjs
          node tests/test_v81_financial_close_integration.cjs
          node tests/test_v81_broiler_full_lifecycle.cjs
          node tests/test_v8_single_purchase_invoice.cjs
          node tests/test_v8_single_workspace.cjs
          node tests/test_v8_shared_purchases.cjs
          node tests/test_v410_vat_contract.cjs
          node tests/test_poultry_cycle_economics.cjs
          node tests/test_unified_sync.cjs
          node tests/test_v8_realtime.cjs
      - name: Preserve PDFs, logos, navigation and native export contracts
        run: |
          node tests/test_android_export_bridge.cjs
          node tests/test_v8_pdf_footer_bounds.cjs
          node tests/test_v8_logo_order_only.cjs
          node tests/test_v8_unified_navigation.cjs

  pdf-pagination:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Print real shared report HTML to multipage A4 PDF
        run: |
          set -euo pipefail
          command -v google-chrome
          if ! command -v pdftotext >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq poppler-utils
          fi
          node tests/build_v81_pdf_footer_fixture.cjs /tmp/pfm-v81-pdf-fixture.html
          timeout 90s google-chrome --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --no-pdf-header-footer --print-to-pdf=/tmp/pfm-v81-check.pdf file:///tmp/pfm-v81-pdf-fixture.html
          test -s /tmp/pfm-v81-check.pdf
          pdftotext -bbox /tmp/pfm-v81-check.pdf /tmp/pfm-v81-layout.xml
          node tests/verify_v81_pdf_footer_bbox.cjs /tmp/pfm-v81-layout.xml
          pdfimages -list /tmp/pfm-v81-check.pdf | head -40
