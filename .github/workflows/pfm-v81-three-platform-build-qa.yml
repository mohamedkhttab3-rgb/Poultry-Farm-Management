name: PFM V8.1 Phase 3 — Android Windows iOS build verification
on:
  push:
    branches: ['feature/pfm-v81-pdf-finance-qa']
    paths: ['.github/workflows/pfm-v81-three-platform-build-qa.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare SDK and dependencies
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-36' 'build-tools;36.0.0'
          npm install --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Generate and compile V8.1 Android app
        run: |
          npx cap add android
          npx cap sync android
          npm run android:icons
          node scripts/install-android-export.cjs
          node scripts/set-android-version.cjs
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: pfm-v81-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Android testing limitation
        run: echo "APK compiled; native printer requires device smoke test. No release was changed."
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build V8.1 Windows installer
        run: |
          npm install --no-audit --no-fund
          npm run build:win
      - name: Confirm EXE exists
        shell: pwsh
        run: |
          $apps = Get-ChildItem -Path 'dist-desktop' -Filter '*.exe' -File
          if (-not $apps) { throw 'No installer/portable Windows EXE generated' }
          foreach ($app in $apps) { Write-Host "$($app.Name): $($app.Length) bytes" }
      - uses: actions/upload-artifact@v4
        with:
          name: pfm-v81-windows
          path: dist-desktop/*.exe
          if-no-files-found: error
  ios-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate V8.1 iOS source with shared PDF logic
        run: |
          npm install --no-audit --no-fund
          npx cap add ios
          npx cap sync ios
          node scripts/set-ios-version.cjs
          test -f ios/App/App/Info.plist
          test -f ios/App/App.xcodeproj/project.pbxproj
          grep -q '8.1.0' ios/App/App.xcodeproj/project.pbxproj
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Archive iOS Xcode project
        run: zip -qr PFM-V8.1-Phase3-iOS-Xcode-Source.zip ios
      - uses: actions/upload-artifact@v4
        with:
          name: pfm-v81-ios
          path: PFM-V8.1-Phase3-iOS-Xcode-Source.zip
          if-no-files-found: error
      - name: iOS testing limitation
        run: echo "Only Xcode project generation validated. Signed IPA and device PDF tests require macOS + Apple signing."

  release-test:
    needs: [android, windows, ios-source]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: qa-files
      - name: Verify and publish separate test candidates
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: pfm-v81-phase3-qa-${{ github.run_id }}
        run: |
          set -euo pipefail
          test -s qa-files/pfm-v81-android/app-debug.apk
          test -s qa-files/pfm-v81-ios/PFM-V8.1-Phase3-iOS-Xcode-Source.zip
          win_file=$(find qa-files/pfm-v81-windows -maxdepth 1 -type f -iname '*.exe' -print -quit)
          test -n "$win_file"
          test -s "$win_file"
          cp qa-files/pfm-v81-android/app-debug.apk PFM-V8.1-Phase3-Android-QA.apk
          cp "$win_file" PFM-V8.1-Phase3-Windows-QA.exe
          cp qa-files/pfm-v81-ios/PFM-V8.1-Phase3-iOS-Xcode-Source.zip .
          sha256sum PFM-V8.1-Phase3-Android-QA.apk PFM-V8.1-Phase3-Windows-QA.exe PFM-V8.1-Phase3-iOS-Xcode-Source.zip
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false --title "PFM V8.1 Phase 3 — testing builds" --notes "TEST ONLY — Android debug APK, unsigned Windows EXE, iOS Xcode source (not signed IPA). Original approved V8.1 untouched." PFM-V8.1-Phase3-Android-QA.apk PFM-V8.1-Phase3-Windows-QA.exe PFM-V8.1-Phase3-iOS-Xcode-Source.zip
