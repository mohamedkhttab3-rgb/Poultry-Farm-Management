name: PFM V8 cross-platform QA
on:
  push:
    branches: ['feature/pfm-v8-android-windows-ios', 'feature/pfm-v8-single-purchase-entry']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shared-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test shared storage, finance and V8 synchronization
        run: |
          node scripts/verify-source.cjs
          node scripts/verify-public.cjs
          node scripts/verify-native.cjs
          node tests/test_unified_sync.cjs
          node tests/test_v8_realtime.cjs
          node tests/test_v8_pdf_footer_bounds.cjs
          node tests/test_v8_logo_order_only.cjs
          node tests/test_v8_unified_navigation.cjs
          node tests/test_v8_shared_purchases.cjs
          node tests/test_v8_single_purchase_invoice.cjs
          node tests/test_v8_single_workspace.cjs
          node tests/test_android_export_bridge.cjs
          node tests/test_v410_vat_contract.cjs
          node tests/test_poultry_cycle_economics.cjs
  qa-release:
    needs: shared-checks
    if: github.ref == 'refs/heads/feature/pfm-v8-single-purchase-entry'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create private draft QA release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: pfm-v8-purchases-qa-${{ github.run_id }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease --title "PFM V8 Purchases QA ($GITHUB_RUN_ID)" --notes "UNAPPROVED TEST BUILD. Use disposable farm data only. Android and Windows builds require device QA; iOS source is not an IPA."
  android-debug:
    needs: [shared-checks, qa-release]
    if: always() && needs.shared-checks.result == 'success' && (needs.qa-release.result == 'success' || needs.qa-release.result == 'skipped')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Generate native Android project
        run: |
          npx cap add android
          npx cap sync android
          npm run android:icons
          node scripts/install-android-export.cjs
          node scripts/set-android-version.cjs
      - name: Build Android V8 QA APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon assembleDebug
      - name: Upload QA APK to private draft release
        if: github.ref == 'refs/heads/feature/pfm-v8-single-purchase-entry'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: pfm-v8-purchases-qa-${{ github.run_id }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk PFM-V8-Android-QA.apk
          gh release upload "$TAG" PFM-V8-Android-QA.apk --repo "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@v4
        if: github.ref != 'refs/heads/feature/pfm-v8-single-purchase-entry'
        with:
          name: PoultryFarmManagement-V8-Android-QA
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
  windows-desktop:
    needs: [shared-checks, qa-release]
    if: always() && needs.shared-checks.result == 'success' && (needs.qa-release.result == 'success' || needs.qa-release.result == 'skipped')
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Windows V8 QA
        run: npm run build:win
      - name: Upload QA Windows EXE to private draft release
        if: github.ref == 'refs/heads/feature/pfm-v8-single-purchase-entry'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: pfm-v8-purchases-qa-${{ github.run_id }}
        shell: pwsh
        run: |
          $app = Get-ChildItem -Path 'dist-desktop' -Filter '*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          if (-not $app) { throw 'Windows EXE was not built.' }
          Copy-Item -LiteralPath $app.FullName -Destination 'PFM-V8-Windows-QA.exe'
          gh release upload $env:TAG 'PFM-V8-Windows-QA.exe' --repo $env:GITHUB_REPOSITORY
      - uses: actions/upload-artifact@v4
        if: github.ref != 'refs/heads/feature/pfm-v8-single-purchase-entry'
        with:
          name: PoultryFarmManagement-V8-Windows-QA
          path: dist-desktop/*.exe
          if-no-files-found: error
          retention-days: 3
  ios-source:
    needs: shared-checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Capacitor iOS source and configuration
        run: |
          npm install --no-audit --no-fund
          npx cap add ios
          npx cap sync ios
          node scripts/set-ios-version.cjs
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: iOS qualification note
        run: echo "iOS source prepared. Signed device IPA requires macOS Xcode signing and physical device QA."
