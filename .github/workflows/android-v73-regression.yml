name: Android V7.3 regression checks
on:
  push:
    branches: [android-v73-ui-export-review-20261016, 'fix/android-reliable-exports-20261017', 'fix/android-v732-navigation-brand', 'fix/android-v733-native-export-rebuild', 'fix/android-v734-direct-print-excel-save', 'fix/android-v735-pdf-print-save-share', 'fix/android-v736-pdf-page-renderer', 'fix/android-v737-paged-pdf', 'fix/android-v738-pdf-null-layout', 'fix/android-v739-native-chromium-pdf', 'fix/android-v7310-pdf-layout', 'fix/android-v7311-pdf-structural-pages', 'fix/android-v7312-a4-screen-image-pdf', 'fix/android-v7313-pdf-canvas-fileprovider', 'fix/android-v7314-native-print-adapter']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android-only-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source and Android native export
        run: |
          node scripts/verify-source.cjs
          node scripts/verify-public.cjs
          node scripts/verify-native.cjs
          node tests/test_android_export_bridge.cjs
          node tests/test_android_v736_pdf_pages.cjs
          node tests/test_android_v737_paged_pdf.cjs
          node tests/test_android_v732_navigation.cjs
          node tests/test_v410_vat_contract.cjs
          node tests/test_pfm74_purchase_core.cjs
          node tests/test_poultry_cycle_economics.cjs
  android-debug:
    needs: android-only-checks
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install required Android SDK
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Install JS dependencies
        run: npm install --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Generate Android project with native export plugin
        run: |
          npx cap add android
          npx cap sync android
          npm run android:icons
          node scripts/install-android-export.cjs
          node scripts/set-android-version.cjs
      - name: Build Android APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon assembleDebug
      - name: Verify APK and SHA256
        run: |
          python3 scripts/check-apk.py android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk > android/app/build/outputs/apk/debug/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PoultryFarmManagement-Android-V7.3.14-QA-debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish direct-download Android V7.3.14 QA APK
        if: github.ref == 'refs/heads/fix/android-v7314-native-print-adapter'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v7.3.14-native-html-print-qa"
          FILE="PoultryFarmManagement-v7.3.14-Android-debug.apk"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release tag already exists; refusing to overwrite existing APK"
            exit 1
          fi
          mkdir -p release-files
          cp android/app/build/outputs/apk/debug/app-debug.apk "release-files/$FILE"
          (cd release-files && sha256sum "$FILE" > SHA256SUMS-v7.3.14.txt)
          gh release create "$TAG" \
            "release-files/$FILE" "release-files/SHA256SUMS-v7.3.14.txt" \
            -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Poultry Farm Management Android V7.3.14 PDF QA" \
            --notes "QA debug APK. Rebuilt Android PDF generator, preserved native print/save/share and Excel XLSX. Automatic source/Android build checks completed, but actual phone PDF test is still required." \
            --prerelease
