name: Build Poultry Farm Management V7.1 (Windows + Android)
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pfm-native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    name: Check version and safe source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check UI, native source and privacy
        run: |
          npm run verify:source
          npm run verify:public
          npm run verify:native
          npm run verify:uploadguard
          node tests/test_v63_storage.cjs
  windows:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Windows installer and portable executable separately (unsigned)
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          $ErrorActionPreference = 'Stop'
          npx electron-builder --win nsis --x64 --publish never
          if ($LASTEXITCODE -ne 0) { throw 'Windows installer build failed' }
          $base = 'PoultryFarmManagement-7.1.0-win-x64'
          $original = Join-Path 'dist-desktop' ($base + '.exe')
          if (-not (Test-Path $original)) { throw 'Missing installer EXE' }
          New-Item -ItemType Directory -Force -Path 'build-staging' | Out-Null
          Move-Item $original (Join-Path 'build-staging' ($base + '-Setup.exe'))
          npx electron-builder --win portable --x64 --publish never
          if ($LASTEXITCODE -ne 0) { throw 'Windows portable build failed' }
          if (-not (Test-Path $original)) { throw 'Missing portable EXE' }
          Move-Item $original (Join-Path 'dist-desktop' ($base + '-Portable.exe'))
          Move-Item (Join-Path 'build-staging' ($base + '-Setup.exe')) (Join-Path 'dist-desktop' ($base + '-Setup.exe'))
          Write-Host 'PASS: Two differently named Windows executables created'
      - name: Check EXE files and generate SHA256
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path dist-desktop -Filter '*.exe' -File)
          if ($files.Count -lt 2) { throw 'Expected both installer and portable Windows EXE' }
          foreach ($file in $files) {
            if ($file.Length -lt 1000000) { throw "Unexpectedly small executable: $($file.Name)" }
            $stream=[System.IO.File]::OpenRead($file.FullName)
            try { if ($stream.ReadByte() -ne 77 -or $stream.ReadByte() -ne 90) { throw "Not a Windows PE EXE: $($file.Name)" } }
            finally { $stream.Dispose() }
            $hash=(Get-FileHash $file.FullName -Algorithm SHA256).Hash
            "$hash  $($file.Name)" | Out-File -FilePath 'dist-desktop/SHA256SUMS.txt' -Append -Encoding utf8
          }
      - uses: actions/upload-artifact@v4
        with:
          name: PoultryFarmManagement-V7.1-Windows-unsigned
          path: |
            dist-desktop/*.exe
            dist-desktop/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
  android:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Use preinstalled Android SDK and install platform/build tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then echo "Missing preinstalled Android sdkmanager: $SDKMANAGER"; exit 1; fi
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;36.0.0'
          echo "Android SDK packages installed"
      - name: Install JS dependencies
        run: npm install --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Generate and sync Android project
        run: |
          npx cap add android
          npx cap sync android
          npm run android:icons
      - name: Set native app version
        run: node scripts/set-android-version.cjs
      - name: Build Android debug APK (not store-signed)
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon assembleDebug
      - name: Verify APK package and checksum
        run: |
          python3 scripts/check-apk.py android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk > android/app/build/outputs/apk/debug/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PoultryFarmManagement-V7.1-Android-debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
