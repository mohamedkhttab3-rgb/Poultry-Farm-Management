name: PFM V8.1 — 80K Two Farm Integration QA
on:
  push:
    branches: ['feature/pfm-v81-qa-80k-feed-unification-20261022']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build synthetic 80K data from verified real accounting procedures
        run: |
          set -euo pipefail
          node scripts/prepare-v81-qa80k.cjs www/pfm-v81-qa80k.json
          node --check www/pfm-v81-qa80k-profile.js
          node --check www/pfm-v8-one-page-purchases.js
          node --check www/pfm-v8-purchases-workspace.js
          node --check www/pfm-v8-invoice-ui.js
          node scripts/verify-source.cjs
          node scripts/verify-native.cjs
      - name: Verify 2 farms 4 houses and independent purchased feed lots
        run: node tests/test_v81_qa80k_feed_unification.cjs
      - name: Real click-to-save and invoice approval on DOM
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund jsdom@26
          node tests/test_v81_purchase_dom.cjs
          node tests/test_v81_report_actions_dom.cjs
      - name: Broiler finance, inventory, all purchases and PDF regressions
        run: |
          set -euo pipefail
          for t in tests/test_v81_two_farms_80k.cjs tests/test_v81_purchases_medications.cjs tests/test_v81_broiler_full_lifecycle.cjs tests/test_v81_financial_close_integration.cjs tests/test_v81_shared_costs_depreciation.cjs tests/test_v81_weight_breed_pdf.cjs tests/test_v81_five_fixes.cjs tests/test_v8_single_workspace.cjs tests/test_v8_single_purchase_invoice.cjs tests/test_v410_vat_contract.cjs tests/test_v8_pdf_footer_bounds.cjs tests/test_android_export_bridge.cjs tests/test_unified_sync.cjs; do node "$t"; done
