name: PFM V8.1 — Weight Breed PDF corrections QA
on:
  push:
    branches: ['feature/pfm-v81-weight-breed-pdf-qa-20261022']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile-time JS integrity and shared Android Windows iOS source verification
        run: |
          set -euo pipefail
          node --check www/pfm-v81-report-actions.js
          node --check www/pfm-v59-print-results.js
          node --check www/pfm-v8-invoice-ui.js
          node --check desktop/main.cjs
          node scripts/verify-source.cjs
          node scripts/verify-native.cjs
      - name: Weight sale checks, breed standard comparator and PDF one-button QA
        run: node tests/test_v81_weight_breed_pdf.cjs
      - name: Functional UI click tests (purchase save and approval)
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund jsdom@26
          node tests/test_v81_purchase_dom.cjs
      - name: Full fictional 80K financial scenario and all key regressions
        run: |
          set -euo pipefail
          for t in tests/test_v81_two_farms_80k.cjs tests/test_v81_purchases_medications.cjs tests/test_v81_broiler_full_lifecycle.cjs tests/test_v81_financial_close_integration.cjs tests/test_v81_shared_costs_depreciation.cjs tests/test_v8_single_workspace.cjs tests/test_v8_single_purchase_invoice.cjs tests/test_v81_five_fixes.cjs tests/test_v410_vat_contract.cjs tests/test_v8_pdf_footer_bounds.cjs tests/test_v8_logo_order_only.cjs tests/test_android_export_bridge.cjs tests/test_unified_sync.cjs; do node "$t"; done
