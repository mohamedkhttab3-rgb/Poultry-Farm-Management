name: PFM V8.1 — five fixes and 80K regression QA
on:
  push:
    branches: ['feature/pfm-v81-five-fixes-20261022']
  pull_request:
    branches: ['feature/pfm-v81-two-farm-80k-validation']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  functional:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check modified application scripts and tests
        run: |
          set -euo pipefail
          node --check www/pfm-v81-issue-corrections.js
          node --check www/pfm-v8-purchases-workspace.js
          node --check www/pfm-v8-invoice-ui.js
          node --check www/pfm-v59-print-results.js
          node --check tests/test_v81_five_fixes.cjs
          node scripts/verify-source.cjs
          node scripts/verify-native.cjs
      - name: Stock corrections, invoice drafts, VAT sales and UI organization
        run: node tests/test_v81_five_fixes.cjs
      - name: Full fictional two-farm accounting integration
        run: node tests/test_v81_two_farms_80k.cjs
      - name: Preserve existing finance, stock, PDF and platform regressions
        run: |
          set -euo pipefail
          node tests/test_v81_shared_costs_depreciation.cjs
          node tests/test_v81_financial_close_integration.cjs
          node tests/test_v81_broiler_full_lifecycle.cjs
          node tests/test_v8_single_workspace.cjs
          node tests/test_v8_single_purchase_invoice.cjs
          node tests/test_v410_vat_contract.cjs
          node tests/test_poultry_cycle_economics.cjs
          node tests/test_v8_pdf_footer_bounds.cjs
          node tests/test_v8_logo_order_only.cjs
          node tests/test_android_export_bridge.cjs
          node tests/test_unified_sync.cjs
          node tests/test_v8_realtime.cjs
          node tests/test_v8_unified_navigation.cjs
