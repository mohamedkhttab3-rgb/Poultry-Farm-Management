name: Preserve Android V7.3.5 Release
on:
  workflow_run:
    workflows: ['Android V7.3 regression checks']
    types: [completed]
    branches: ['fix/android-v735-pdf-print-save-share']
permissions:
  contents: write
  actions: read
jobs:
  archive:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Retrieve successful APK and validate checksum
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          mkdir -p release-files
          gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" --name PoultryFarmManagement-Android-V7.3.5-QA-debug --dir release-files
          test -s release-files/app-debug.apk
          (cd release-files && sha256sum -c SHA256SUMS.txt)
          mv release-files/app-debug.apk release-files/PoultryFarmManagement-v7.3.5-Android-debug.apk
          (cd release-files && sha256sum PoultryFarmManagement-v7.3.5-Android-debug.apk > SHA256SUMS-v7.3.5.txt)
      - name: Publish version-specific persistent prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if gh release view v7.3.5 -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'v7.3.5 is already published. Never overwrite release assets.'
            exit 0
          fi
          gh release create v7.3.5             release-files/PoultryFarmManagement-v7.3.5-Android-debug.apk             release-files/SHA256SUMS-v7.3.5.txt             -R "$GITHUB_REPOSITORY" --target "$SOURCE_SHA"             --title 'Poultry Farm Management Android V7.3.5 (Pre-release)'             --notes 'PDF has separate print, save and share actions. Multipage PDF attempts to preserve complete charts/images and stamps a centered logo on every page. Excel exports real XLSX via the Android file save picker. Debug build; real-device PDF output acceptance remains unverified.' --prerelease
          gh release view v7.3.5 -R "$GITHUB_REPOSITORY" --json tagName,assets,url
